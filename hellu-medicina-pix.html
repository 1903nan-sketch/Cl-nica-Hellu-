<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hellu Medicina e Estética — Pix</title>
<style>
  :root{
    --ink: #4A3F35;
    --ink-soft: rgba(74,63,53,0.6);
    --glass-fill: rgba(255,255,255,0.40);
    --glass-fill-strong: rgba(255,255,255,0.6);
    --glass-border: rgba(255,255,255,0.65);
    --glass-shadow: rgba(150,110,80,0.16);
    --terracotta: #C9A183;
    --terracotta-deep: #B08A6C;
    --olive: #DCC0A3;
    --good: #B39C7E;
  }
  *{box-sizing:border-box;}
  html{
    height:100%;
    background:
      radial-gradient(circle at 12% 15%, #F0DED0 0%, transparent 48%),
      radial-gradient(circle at 88% 12%, #ECDCCB 0%, transparent 50%),
      radial-gradient(circle at 18% 88%, #E6D2BC 0%, transparent 52%),
      radial-gradient(circle at 92% 90%, #F4E8DB 0%, transparent 55%),
      linear-gradient(160deg, #FBF6F0 0%, #F8F1E9 45%, #F5EEE3 100%);
    background-attachment: fixed;
  }
  body{
    margin:0;padding:0;
    min-height:100%;
    position:relative;
    overflow-x:hidden;
    background: transparent;
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Segoe UI', sans-serif;
    color:var(--ink);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 16px;
  }

  body::before, body::after{
    content:'';
    position:absolute;
    border-radius:50%;
    filter: blur(60px);
    z-index:0;
    opacity:0.5;
    pointer-events:none;
  }
  body::before{
    width:280px;height:280px;
    background: linear-gradient(135deg, #EED9C4, #F5E8DA);
    top:-60px; left:-80px;
  }
  body::after{
    width:320px;height:320px;
    background: linear-gradient(135deg, #E6D0B8, #F0E2D0);
    bottom:-90px; right:-90px;
  }

  .wrap{
    position:relative;
    z-index:1;
    width:100%;
    max-width:400px;
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  .logo{
    width:104px;
    height:104px;
    border-radius:50%;
    overflow:hidden;
    margin-bottom:24px;
    background: var(--glass-fill-strong);
    backdrop-filter: blur(20px) saturate(160%);
    -webkit-backdrop-filter: blur(20px) saturate(160%);
    border:1px solid var(--glass-border);
    box-shadow:
      0 8px 32px var(--glass-shadow),
      inset 0 1px 1px rgba(255,255,255,0.9);
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .logo img{width:100%;height:100%;object-fit:cover;display:block;}

  .eyebrow{
    letter-spacing:0.28em;
    text-transform:uppercase;
    font-size:11px;
    color:var(--ink-soft);
    margin-bottom:8px;
    font-weight:600;
  }
  h1{
    font-weight:600;
    font-size:23px;
    letter-spacing:-0.005em;
    margin:0 0 4px;
    text-align:center;
    color:var(--ink);
    line-height:1.25;
  }
  .cnpj{
    font-size:11.5px;
    letter-spacing:0.04em;
    color:var(--ink-soft);
    margin:0 0 18px;
    text-align:center;
  }
  .sub{
    font-size:14px;
    color:var(--ink-soft);
    text-align:center;
    margin:0 0 30px;
    line-height:1.5;
    max-width:300px;
  }

  .card{
    width:100%;
    background: var(--glass-fill);
    backdrop-filter: blur(28px) saturate(180%);
    -webkit-backdrop-filter: blur(28px) saturate(180%);
    border:1px solid var(--glass-border);
    border-radius:26px;
    padding:34px 24px;
    box-shadow:
      0 18px 44px var(--glass-shadow),
      inset 0 1px 1px rgba(255,255,255,0.85),
      inset 0 -1px 1px rgba(255,255,255,0.2);
    display:flex;
    flex-direction:column;
    align-items:center;
    position:relative;
  }
  .card::before{
    content:'';
    position:absolute;
    top:0; left:14px; right:14px;
    height:1px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.9), transparent);
  }

  .label{
    font-size:11.5px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin-bottom:20px;
    font-weight:600;
    text-align:center;
  }

  button#copyBtn{
    width:100%;
    padding:22px 20px;
    border:1px solid rgba(255,255,255,0.55);
    border-radius:18px;
    background: linear-gradient(135deg, var(--terracotta), var(--olive));
    color:#fff;
    font-size:18px;
    font-weight:600;
    letter-spacing:0.01em;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:11px;
    transition: transform .15s ease, box-shadow .2s ease, background .3s ease;
    font-family:inherit;
    box-shadow:
      0 10px 28px rgba(201,161,131,0.32),
      inset 0 1px 1px rgba(255,255,255,0.5);
  }
  button#copyBtn:hover{
    transform: translateY(-1px);
    box-shadow:
      0 14px 34px rgba(201,161,131,0.40),
      inset 0 1px 1px rgba(255,255,255,0.6);
  }
  button#copyBtn:active{ transform: scale(0.98) translateY(0); }
  button#copyBtn:focus-visible{
    outline:3px solid rgba(201,161,131,0.5);
    outline-offset:2px;
  }
  button#copyBtn.copied{
    background: linear-gradient(135deg, var(--good), #C9AE8D);
    box-shadow:
      0 10px 28px rgba(179,156,126,0.32),
      inset 0 1px 1px rgba(255,255,255,0.5);
  }

  button#copyBtn svg{ width:21px; height:21px; flex-shrink:0; }

  @media (prefers-reduced-motion: reduce){
    button#copyBtn{ transition:none; }
  }
</style>
</head>

      <button id="copyBtn" type="button">
        <svg id="iconDefault" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="9" y="9" width="13" height="13" rx="2"></rect>
          <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
        </svg>
        <svg id="iconCheck" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;">

<script>
  const btn = document.getElementById('copyBtn');
  const label = document.getElementById('btnLabel');
  const iconDefault = document.getElementById('iconDefault');
  const iconCheck = document.getElementById('iconCheck');
  const pixKey = document.getElementById('pixKeyData').dataset.key.trim();

  let audioCtx = null;
  function playClickSound(){
    try{
      if(!audioCtx){
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if(audioCtx.state === 'suspended'){
        audioCtx.resume();
      }
      const now = audioCtx.currentTime;

      // iPhone-like "tock" — a short, high, damped click
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(1200, now);
      osc.frequency.exponentialRampToValueAtTime(700, now + 0.045);

      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(0.35, now + 0.004);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.07);

      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.08);

      // tiny secondary tick for texture
      const osc2 = audioCtx.createOscillator();
      const gain2 = audioCtx.createGain();
      osc2.type = 'triangle';
      osc2.frequency.setValueAtTime(2200, now);
      gain2.gain.setValueAtTime(0.0001, now);
      gain2.gain.exponentialRampToValueAtTime(0.12, now + 0.002);
      gain2.gain.exponentialRampToValueAtTime(0.0001, now + 0.03);
      osc2.connect(gain2);
      gain2.connect(audioCtx.destination);
      osc2.start(now);
      osc2.stop(now + 0.04);
    }catch(e){
      // audio not available — fail silently
    }
  }

  btn.addEventListener('click', async () => {
    playClickSound();
    try {
      await navigator.clipboard.writeText(pixKey);
    } catch (err) {
      const ta = document.createElement('textarea');
      ta.value = pixKey;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
    }
    btn.classList.add('copied');
    label.textContent = 'Chave copiada!';
    iconDefault.style.display = 'none';
    iconCheck.style.display = 'block';
    setTimeout(() => {
      btn.classList.remove('copied');
      label.textContent = 'Copiar chave Pix';
      iconDefault.style.display = 'block';
      iconCheck.style.display = 'none';
    }, 2200);
  });
</script>
